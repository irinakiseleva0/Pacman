<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyberpunk Pac-Man</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02030b;
    }

    canvas {
      display: block;
    }

    #game {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: transparent;
    }

    .scanline-overlay,
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .scanline-overlay {
      z-index: 10;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15) 0,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .vignette-overlay {
      z-index: 9;
      background: radial-gradient(circle at center, transparent 44%, rgba(0, 0, 0, 0.6) 100%);
    }
  </style>
</head>
<body>
<canvas id="bg" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;"></canvas>
<canvas id="game"></canvas>
<div class="vignette-overlay" aria-hidden="true"></div>
<div class="scanline-overlay" aria-hidden="true"></div>
<script>
(() => {
  "use strict";

  const bgCanvas = document.getElementById("bg");
  const bgCtx = bgCanvas.getContext("2d");
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const COLS = 28;
  const ROWS = 31;
  const WALL = 1;
  const DOT = 0;
  const EMPTY = 2;
  const POWER = 3;
  const DOOR = 4;
  const DIRS = {
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    none: { x: 0, y: 0 }
  };
  const OPPOSITE = { left: "right", right: "left", up: "down", down: "up", none: "none" };
  const GHOST_COLORS = ["#ff4d4d", "#ff69b4", "#00eeff", "#ffaa00"];
  const SCATTER_TARGETS = [
    { x: 26, y: 1 },
    { x: 1, y: 1 },
    { x: 26, y: 29 },
    { x: 1, y: 29 }
  ];

  const mazeTemplate = [
    "1111111111111111111111111111",
    "1000000000000110000000000001",
    "1011110111110110111110111101",
    "1300010000010000100000100031",
    "1011110111110110111110111101",
    "1000000000000000000000000001",
    "1011110110111111110110111101",
    "1000000110000110000110000001",
    "1111110111112112111110111111",
    "2222210112222222222110122222",
    "1111110112111111112110111111",
    "2222220002122222221200022222",
    "1111110112111441112110111111",
    "2222220122112222112210222222",
    "0000000122112222112210000000",
    "2222220122111111112210222222",
    "1111110112222222222110111111",
    "2222210112111111112110122222",
    "1111110112111111112110111111",
    "1000000000000110000000000001",
    "1011110111110110111110111101",
    "1300110000010000100000110031",
    "1110110110111111110110110111",
    "1000000110000110000110000001",
    "1011111111110110111111111101",
    "1000000000000000000000000001",
    "1011110111110110111110111101",
    "1000010000010000100000100001",
    "1011011111011111110111110111",
    "1000000000000000000000000001",
    "1111111111111111111111111111"
  ];

  let grid;
  let score;
  let lives;
  let dotsLeft;
  let frightenedTimer;
  let gameOver;
  let levelComplete;
  let lastTime;
  let tile;
  let offsetX;
  let offsetY;
  let pac;
  let ghosts;
  let wantedDir;
  let pulseTime;
  let started;
  let deathTimer;
  let levelFlashTimer;
  let menuIndex;

  const MENU_OPTIONS = ["EASY", "NORMAL", "HARD"];
  const particles = Array.from({ length: 20 }, (_, i) => ({
    x: (i * 53 + 19) % 340,
    y: (i * 89 + 31) % 520,
    speed: 5 + (i % 5) * 1.6,
    drift: (i % 2 === 0 ? 1 : -1) * (2 + (i % 3))
  }));
  const goldenDots = [
    { x: 0.18, y: 0.78, delay: 0 },
    { x: 0.76, y: 0.68, delay: 0.8 },
    { x: 0.28, y: 0.24, delay: 1.5 },
    { x: 0.84, y: 0.34, delay: 2.2 }
  ];
  const skyline = [
    { x: 0.03, w: 0.15, h: 0.22 },
    { x: 0.20, w: 0.18, h: 0.34 },
    { x: 0.42, w: 0.13, h: 0.26 },
    { x: 0.59, w: 0.19, h: 0.42 },
    { x: 0.82, w: 0.14, h: 0.30 }
  ];
  const bgParticles = Array.from({ length: 25 }, (_, i) => {
    const seed = i * 97 + 31;
    return {
      x: (seed * 17) % 1000,
      y: (seed * 43) % 800,
      radius: 1.5 + (seed % 16) / 10,
      vx: -0.2 + ((seed * 7) % 41) / 100,
      vy: -0.3 - ((seed * 11) % 51) / 100,
      color: i % 10 < 7 ? "rgba(0,238,255,0.5)" : "rgba(255,170,0,0.6)"
    };
  });

  function resize() {
    const cellSize = Math.floor(Math.min(window.innerWidth / 28, window.innerHeight / 31));
    canvas.width = cellSize * 28;
    canvas.height = cellSize * 31;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    tile = cellSize;
    offsetX = 0;
    offsetY = 0;
  }

  function resizeBackground() {
    const dpr = window.devicePixelRatio || 1;
    bgCanvas.style.width = window.innerWidth + "px";
    bgCanvas.style.height = window.innerHeight + "px";
    bgCanvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
    bgCanvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function canvasWidth() {
    return canvas.width;
  }

  function canvasHeight() {
    return canvas.height;
  }

  function drawCityBackground() {
    const w = bgCanvas.clientWidth || window.innerWidth;
    const h = bgCanvas.clientHeight || window.innerHeight;
    bgCtx.clearRect(0, 0, w, h);
    bgCtx.fillStyle = "#02030b";
    bgCtx.fillRect(0, 0, w, h);

    bgCtx.save();
    bgCtx.strokeStyle = "rgba(0,238,255,0.04)";
    bgCtx.lineWidth = 1;
    for (let x = 0.5; x < w; x += 48) {
      bgCtx.beginPath();
      bgCtx.moveTo(x, 0);
      bgCtx.lineTo(x, h);
      bgCtx.stroke();
    }
    for (let y = 0.5; y < h; y += 48) {
      bgCtx.beginPath();
      bgCtx.moveTo(0, y);
      bgCtx.lineTo(w, y);
      bgCtx.stroke();
    }
    bgCtx.restore();

    bgCtx.save();
    bgCtx.fillStyle = "rgba(0,238,255,0.08)";
    for (let dx = 0; dx <= w; dx += 32) {
      for (let dy = 0; dy <= h; dy += 32) {
        bgCtx.beginPath();
        bgCtx.arc(dx, dy, 0.8, 0, Math.PI * 2);
        bgCtx.fill();
      }
    }
    bgCtx.restore();

    let x = 0;
    let index = 0;
    const buildingBandTop = h * 0.70;
    const maxBuildingHeight = h * 0.30;
    while (x < w) {
      const bw = 60 + (index * 37) % 81;
      const bh = Math.min(maxBuildingHeight, 150 + (index * 53) % 201);
      const top = Math.max(buildingBandTop, h - bh);
      bgCtx.fillStyle = index % 2 === 0 ? "#050d1a" : "#080f22";
      bgCtx.fillRect(x, top, bw, bh);
      bgCtx.save();
      bgCtx.globalAlpha = 0.3;
      bgCtx.strokeStyle = "#00eeff";
      bgCtx.lineWidth = 0.5;
      bgCtx.strokeRect(x + 0.5, top + 0.5, bw - 1, bh - 1);
      bgCtx.restore();
      for (let wx = x + 8; wx < x + bw - 8; wx += 10) {
        for (let wy = top + 12; wy < h - 8; wy += 12) {
          const lit = (Math.floor(wx * 7 + wy * 11 + index * 23) % 10) >= 4;
          if (lit) {
            const tone = Math.floor(wx + wy + index) % 3;
            bgCtx.fillStyle = tone === 0
              ? "rgba(0,238,255,0.35)"
              : tone === 1
                ? "rgba(255,170,0,0.4)"
                : "rgba(255,255,255,0.2)";
            bgCtx.fillRect(wx, wy, 2, 2);
          }
        }
      }
      x += bw;
      index++;
    }

    bgCtx.save();
    bgCtx.strokeStyle = "rgba(0,0,0,0.12)";
    bgCtx.lineWidth = 1;
    for (let y = 0.5; y < h; y += 3) {
      bgCtx.beginPath();
      bgCtx.moveTo(0, y);
      bgCtx.lineTo(w, y);
      bgCtx.stroke();
    }
    bgCtx.restore();

    for (const particle of bgParticles) {
      particle.x += particle.vx;
      particle.y += particle.vy;
      if (particle.y < -8) {
        particle.y = h + 8;
        particle.x = (particle.x + 137) % Math.max(w, 1);
      }
      if (particle.x < -8) particle.x = w + 8;
      if (particle.x > w + 8) particle.x = -8;
      bgCtx.fillStyle = particle.color;
      bgCtx.beginPath();
      bgCtx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
      bgCtx.fill();
    }

    const accent = bgCtx.createLinearGradient(w - 2, 0, w - 2, h);
    accent.addColorStop(0, "#ff00cc");
    accent.addColorStop(1, "#6600ff");
    bgCtx.save();
    bgCtx.globalAlpha = 0.8;
    bgCtx.fillStyle = accent;
    bgCtx.fillRect(w - 2, 0, 2, h);
    bgCtx.restore();

    const leftPanelWidth = w * 0.3;
    bgCtx.fillStyle = "rgba(0,5,15,0.3)";
    bgCtx.fillRect(0, 0, leftPanelWidth, h);
    bgCtx.fillStyle = "rgba(0,238,255,0.08)";
    for (let px = 14; px < leftPanelWidth - 6; px += 16) {
      for (let py = 14; py < h; py += 16) {
        bgCtx.fillRect(px, py, 2, 2);
      }
    }

    const vignette = bgCtx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.12, w / 2, h / 2, Math.max(w, h) * 0.62);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,0.65)");
    bgCtx.fillStyle = vignette;
    bgCtx.fillRect(0, 0, w, h);
  }

  function backgroundLoop() {
    drawCityBackground();
    requestAnimationFrame(backgroundLoop);
  }

  function makeGrid() {
    const next = mazeTemplate.map((row) => row.split("").map(Number));
    dotsLeft = 0;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (next[y][x] === DOT || next[y][x] === POWER) dotsLeft++;
      }
    }
    return next;
  }

  function resetActors() {
    pac = {
      x: 13.5,
      y: 23.5,
      dir: "left",
      nextDir: "left",
      speed: 8.2,
      mouth: 0
    };
    wantedDir = "left";
    ghosts = [
      makeGhost(13.5, 11.5, "#ff4d4d", "chase"),
      makeGhost(12.5, 14.5, "#ff69b4", "random"),
      makeGhost(13.5, 14.5, "#00eeff", "scatter"),
      makeGhost(14.5, 14.5, "#ffaa00", "random")
    ];
  }

  function makeGhost(x, y, color, mode) {
    return {
      startX: x,
      startY: y,
      x,
      y,
      color,
      mode,
      dir: "left",
      speed: 6.2,
      turnCooldown: 0
    };
  }

  function newGame() {
    grid = makeGrid();
    score = 0;
    lives = 3;
    frightenedTimer = 0;
    gameOver = false;
    levelComplete = false;
    pulseTime = 0;
    deathTimer = 0;
    levelFlashTimer = 0;
    resetActors();
    lastTime = performance.now();
  }

  function restartLevel() {
    frightenedTimer = 0;
    resetActors();
  }

  function tileAt(x, y) {
    const tx = Math.floor(x);
    const ty = Math.floor(y);
    if (tx < 0 || tx >= COLS) return EMPTY;
    if (ty < 0 || ty >= ROWS) return WALL;
    return grid[ty][tx];
  }

  function blocked(x, y, isGhost) {
    const t = tileAt(x, y);
    return t === WALL || (t === DOOR && !isGhost);
  }

  function canMove(entity, dirName, isGhost) {
    const dir = DIRS[dirName];
    if (!dir || dirName === "none") return true;
    const nx = entity.x + dir.x * 0.42;
    const ny = entity.y + dir.y * 0.42;
    return !blocked(nx, ny, isGhost);
  }

  function nearCenter(entity) {
    return Math.abs(entity.x - Math.floor(entity.x) - 0.5) < 0.09 &&
      Math.abs(entity.y - Math.floor(entity.y) - 0.5) < 0.09;
  }

  function snap(entity) {
    entity.x = Math.floor(entity.x) + 0.5;
    entity.y = Math.floor(entity.y) + 0.5;
  }

  function moveEntity(entity, dt, isGhost) {
    const dir = DIRS[entity.dir];
    const step = entity.speed * dt;
    if (!canMove(entity, entity.dir, isGhost)) {
      snap(entity);
      return;
    }
    entity.x += dir.x * step;
    entity.y += dir.y * step;
    if (entity.x < -0.5) entity.x = COLS - 0.5;
    if (entity.x > COLS - 0.5) entity.x = -0.5;
  }

  function updatePac(dt) {
    pac.mouth += dt * 14;
    if (nearCenter(pac)) {
      snap(pac);
      if (canMove(pac, wantedDir, false)) pac.dir = wantedDir;
      if (!canMove(pac, pac.dir, false)) pac.dir = "none";
      const x = Math.floor(pac.x);
      const y = Math.floor(pac.y);
      if (grid[y] && grid[y][x] === DOT) {
        grid[y][x] = EMPTY;
        dotsLeft--;
        score += 10;
      } else if (grid[y] && grid[y][x] === POWER) {
        grid[y][x] = EMPTY;
        dotsLeft--;
        score += 50;
        frightenedTimer = 8;
      }
      if (dotsLeft <= 0) {
        levelComplete = true;
        levelFlashTimer = 1.1;
      }
    }
    moveEntity(pac, dt, false);
  }

  function chooseGhostDir(ghost, index) {
    const options = ["left", "right", "up", "down"].filter((dir) => {
      if (dir === OPPOSITE[ghost.dir]) return false;
      return canMove(ghost, dir, true);
    });
    const legal = options.length ? options : ["left", "right", "up", "down"].filter((dir) => canMove(ghost, dir, true));
    if (!legal.length) return OPPOSITE[ghost.dir];
    if (frightenedTimer > 0 || ghost.mode === "random") {
      return legal[Math.floor(Math.random() * legal.length)];
    }
    let target = pac;
    if (ghost.mode === "scatter") target = SCATTER_TARGETS[index];
    let best = legal[0];
    let bestDist = Infinity;
    for (const dirName of legal) {
      const dir = DIRS[dirName];
      const dx = ghost.x + dir.x - target.x;
      const dy = ghost.y + dir.y - target.y;
      const dist = dx * dx + dy * dy;
      if (dist < bestDist) {
        bestDist = dist;
        best = dirName;
      }
    }
    return best;
  }

  function updateGhosts(dt) {
    for (let i = 0; i < ghosts.length; i++) {
      const ghost = ghosts[i];
      ghost.turnCooldown -= dt;
      ghost.speed = frightenedTimer > 0 ? 4.7 : 6.2;
      if (nearCenter(ghost) && ghost.turnCooldown <= 0) {
        snap(ghost);
        ghost.dir = chooseGhostDir(ghost, i);
        ghost.turnCooldown = frightenedTimer > 0 ? 0.18 : 0.08;
      }
      moveEntity(ghost, dt, true);
    }
  }

  function handleCollisions() {
    for (const ghost of ghosts) {
      const dx = ghost.x - pac.x;
      const dy = ghost.y - pac.y;
      if (dx * dx + dy * dy > 0.42) continue;
      if (frightenedTimer > 0) {
        score += 200;
        ghost.x = ghost.startX;
        ghost.y = ghost.startY;
        ghost.dir = "left";
      } else {
        lives--;
        deathTimer = 0.75;
        if (lives <= 0) {
          gameOver = true;
        }
      }
      return;
    }
  }

  function update(dt) {
    pulseTime += dt;
    if (!started) return;
    if (levelFlashTimer > 0) levelFlashTimer = Math.max(0, levelFlashTimer - dt);
    if (deathTimer > 0) {
      deathTimer = Math.max(0, deathTimer - dt);
      if (deathTimer === 0 && !gameOver) restartLevel();
      return;
    }
    if (gameOver || levelComplete) return;
    frightenedTimer = Math.max(0, frightenedTimer - dt);
    updatePac(dt);
    updateGhosts(dt);
    handleCollisions();
  }

  function sx(x) {
    return offsetX + x * tile;
  }

  function sy(y) {
    return offsetY + y * tile;
  }

  function roundRectPath(x, y, w, h, r) {
    if (ctx.roundRect) {
      ctx.roundRect(x, y, w, h, r);
      return;
    }
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
  }

  function drawBackground() {
    ctx.fillStyle = "#02030b";
    ctx.fillRect(0, 0, canvasWidth(), canvasHeight());
    ctx.save();
    ctx.strokeStyle = "rgba(0,238,255,0.04)";
    ctx.lineWidth = 1;
    for (let x = 0.5; x < canvasWidth(); x += tile) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvasHeight());
      ctx.stroke();
    }
    for (let y = 0.5; y < canvasHeight(); y += tile) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvasWidth(), y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMaze() {
    ctx.save();
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const cell = grid[y][x];
        if (cell === WALL) {
          ctx.shadowColor = "#00eeff";
          ctx.shadowBlur = 10;
          ctx.fillStyle = "#0a2a3a";
          ctx.strokeStyle = "#00eeff";
          ctx.lineWidth = Math.max(1.5, tile * 0.08);
          ctx.beginPath();
          roundRectPath(
            sx(x) + tile * 0.08,
            sy(y) + tile * 0.08,
            tile * 0.84,
            tile * 0.84,
            Math.max(3, tile * 0.12)
          );
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else if (cell === DOOR) {
          ctx.shadowColor = "#ff00aa";
          ctx.shadowBlur = 12;
          ctx.strokeStyle = "#ff00aa";
          ctx.lineWidth = Math.max(2, tile * 0.12);
          ctx.beginPath();
          ctx.moveTo(sx(x) + tile * 0.12, sy(y) + tile * 0.5);
          ctx.lineTo(sx(x + 1) - tile * 0.12, sy(y) + tile * 0.5);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawDots() {
    ctx.save();
    const flash = levelFlashTimer > 0 && Math.floor(levelFlashTimer * 12) % 2 === 0;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const cell = grid[y][x];
        if (cell !== DOT && cell !== POWER) continue;
        const cx = sx(x + 0.5);
        const cy = sy(y + 0.5);
        ctx.beginPath();
        if (cell === POWER) {
          const pulse = 1 + Math.sin(Date.now() / 300) * 0.2;
          ctx.fillStyle = flash ? "#ffffff" : "#ffe66d";
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 12;
          ctx.arc(cx, cy, tile * 0.18 * pulse, 0, Math.PI * 2);
        } else {
          ctx.fillStyle = flash ? "#ffffff" : "#00eeff";
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 6;
          ctx.arc(cx, cy, 2, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }
    if (levelComplete && flash) {
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 8;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = Number(mazeTemplate[y][x]);
          if (cell !== DOT && cell !== POWER) continue;
          ctx.beginPath();
          ctx.arc(sx(x + 0.5), sy(y + 0.5), cell === POWER ? tile * 0.2 : 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawPacAt(cx, cy, r, dirName, spin, scale) {
    const dir = DIRS[dirName] || DIRS.left;
    const base = Math.atan2(dir.y, dir.x) + spin;
    const mouth = (0.1 + (Math.sin(Date.now() / 95) + 1) * 0.175) * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r * scale, base + mouth, base + Math.PI * 2 - mouth);
    ctx.closePath();
    ctx.fill();
  }

  function drawPac() {
    const progress = deathTimer > 0 ? 1 - deathTimer / 0.75 : 0;
    const spin = progress * Math.PI * 4;
    const scale = deathTimer > 0 ? Math.max(0.05, 1 - progress) : 1;
    ctx.save();
    ctx.fillStyle = "#ffe66d";
    ctx.shadowColor = "#ffe66d";
    ctx.shadowBlur = 14;
    drawPacAt(sx(pac.x), sy(pac.y), tile * 0.42, pac.dir, spin, scale);
    ctx.restore();
  }

  function drawGhost(ghost) {
    const cx = sx(ghost.x);
    const cy = sy(ghost.y);
    const r = tile * 0.38;
    const color = frightenedTimer > 0 ? "#1a1aff" : ghost.color;
    const dir = DIRS[ghost.dir] || DIRS.left;
    ctx.save();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 13;
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.12, r, Math.PI, 0);
    ctx.lineTo(cx + r, cy + r * 0.56);
    ctx.quadraticCurveTo(cx + r * 0.68, cy + r * 0.82, cx + r * 0.34, cy + r * 0.56);
    ctx.quadraticCurveTo(cx, cy + r * 0.82, cx - r * 0.34, cy + r * 0.56);
    ctx.quadraticCurveTo(cx - r * 0.68, cy + r * 0.82, cx - r, cy + r * 0.56);
    ctx.lineTo(cx - r, cy - r * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.36, cy - r * 0.1, r * 0.18, r * 0.23, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + r * 0.36, cy - r * 0.1, r * 0.18, r * 0.23, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = frightenedTimer > 0 ? "#1a1aff" : "#02030b";
    ctx.beginPath();
    ctx.arc(cx - r * 0.36 + dir.x * r * 0.05, cy - r * 0.1 + dir.y * r * 0.06, r * 0.08, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.36 + dir.x * r * 0.05, cy - r * 0.1 + dir.y * r * 0.06, r * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHudPacIcon(x, y) {
    ctx.save();
    ctx.fillStyle = "#ffe66d";
    ctx.shadowColor = "#ffe66d";
    ctx.shadowBlur = 8;
    drawPacAt(x, y, 8, "right", 0, 1);
    ctx.restore();
  }

  function drawHud() {
    ctx.save();
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(5, 10, 25, 0.92)";
    ctx.fillRect(0, 0, canvasWidth(), Math.max(34, tile * 1.15));
    ctx.strokeStyle = "rgba(0, 238, 255, 0.28)";
    ctx.beginPath();
    ctx.moveTo(0, Math.max(34, tile * 1.15));
    ctx.lineTo(canvasWidth(), Math.max(34, tile * 1.15));
    ctx.stroke();
    ctx.fillStyle = "#00eeff";
    ctx.shadowColor = "#00eeff";
    ctx.shadowBlur = 8;
    ctx.fillText("SCORE", 16, 19);
    ctx.fillStyle = "#00eeff";
    ctx.fillText(String(score).padStart(5, "0"), 80, 19);
    ctx.shadowBlur = 0;
    for (let i = 0; i < lives; i++) {
      drawHudPacIcon(canvasWidth() - 24 - i * 22, 19);
    }
    ctx.restore();
  }

  function drawStartBackground() {
    const t = pulseTime;
    ctx.save();
    ctx.fillStyle = "#02030b";
    ctx.fillRect(0, 0, canvasWidth(), canvasHeight());
    ctx.strokeStyle = "rgba(0,238,255,0.04)";
    ctx.lineWidth = 1;
    for (let x = 0.5; x < canvasWidth(); x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvasHeight());
      ctx.stroke();
    }
    for (let y = 0.5; y < canvasHeight(); y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvasWidth(), y);
      ctx.stroke();
    }

    ctx.fillStyle = "#0a0f1a";
    for (const building of skyline) {
      const x = building.x * canvasWidth();
      const w = building.w * canvasWidth();
      const h = building.h * canvasHeight();
      ctx.fillRect(x, canvasHeight() - h, w, h);
      ctx.fillStyle = "rgba(0,238,255,0.08)";
      for (let wx = x + 8; wx < x + w - 8; wx += 16) {
        for (let wy = canvasHeight() - h + 14; wy < canvasHeight() - 16; wy += 22) {
          ctx.fillRect(wx, wy, 4, 7);
        }
      }
      ctx.fillStyle = "#0a0f1a";
    }

    ctx.fillStyle = "rgba(0,238,255,0.4)";
    for (const particle of particles) {
      const x = (particle.x + t * particle.drift + canvasWidth()) % canvasWidth();
      const y = (particle.y - t * particle.speed + canvasHeight()) % canvasHeight();
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const dot of goldenDots) {
      const local = (t + dot.delay) % 3.2;
      const alpha = Math.max(0, 1 - local / 3.2);
      const y = dot.y * canvasHeight() - local * 28;
      ctx.fillStyle = `rgba(255, 230, 109, ${alpha * 0.85})`;
      ctx.shadowColor = "#ffe66d";
      ctx.shadowBlur = 10 * alpha;
      ctx.beginPath();
      ctx.arc(dot.x * canvasWidth(), y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSeparator(x, y, w) {
    ctx.save();
    ctx.strokeStyle = "rgba(0,238,255,0.65)";
    ctx.shadowColor = "#00eeff";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.stroke();
    ctx.restore();
  }

  function drawMenuButton(x, y, w, h, label, selected) {
    ctx.save();
    ctx.fillStyle = selected ? "#00eeff" : "rgba(2, 3, 11, 0.86)";
    ctx.strokeStyle = "#00eeff";
    ctx.shadowColor = selected ? "#00eeff" : "rgba(0,238,255,0.35)";
    ctx.shadowBlur = selected ? 14 : 6;
    ctx.beginPath();
    roundRectPath(x, y, w, h, 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = selected ? "#02030b" : "#ffffff";
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.restore();
  }

  function drawBrand(y) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#00eeff";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#00eeff";
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.fillText("CYBER DISTRICT", canvasWidth() / 2, y - 58);
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 56px 'Courier New', monospace";
    ctx.fillText("PAC-MAN", canvasWidth() / 2, y);
    ctx.restore();
  }

  function drawStartScreen() {
    ctx.save();
    const panelWidth = 380;
    const panelHeight = 430;
    const panelX = (canvasWidth() - panelWidth) / 2;
    const panelY = Math.max(18, canvasHeight() * 0.42 - panelHeight / 2);
    ctx.fillStyle = "rgba(5,10,25,0.92)";
    ctx.strokeStyle = "rgba(0,238,255,0.3)";
    ctx.shadowColor = "rgba(0,238,255,0.35)";
    ctx.shadowBlur = 24;
    ctx.beginPath();
    roundRectPath(panelX, panelY, panelWidth, panelHeight, 12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff9900";
    ctx.font = "bold 11px 'Courier New', monospace";
    ctx.fillText("CYBER DISTRICT", canvasWidth() / 2, panelY + 54);
    ctx.shadowColor = "#00eeff";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px 'Courier New', monospace";
    ctx.fillText("PAC-MAN", canvasWidth() / 2, panelY + 112);
    drawSeparator(panelX + 38, panelY + 160, panelWidth - 76);

    for (let i = 0; i < MENU_OPTIONS.length; i++) {
      drawMenuButton(panelX + 58, panelY + 190 + i * 50, panelWidth - 116, 36, MENU_OPTIONS[i], i === menuIndex);
    }

    drawSeparator(panelX + 38, panelY + 360, panelWidth - 76);
    if (Math.floor(Date.now() / 420) % 2 === 0) {
      ctx.shadowColor = "#00eeff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#00eeff";
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillText("PRESS ENTER TO START", canvasWidth() / 2, panelY + 392);
    }
    ctx.restore();
  }

  function drawGameOverScreen() {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(0, 0, canvasWidth(), canvasHeight());
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#ff4d4d";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ff4d4d";
    ctx.font = "bold 48px 'Courier New', monospace";
    ctx.fillText("GAME OVER", canvasWidth() / 2, canvasHeight() / 2 - 34);
    ctx.shadowColor = "#00eeff";
    ctx.fillStyle = "#00eeff";
    ctx.font = "bold 18px 'Courier New', monospace";
    ctx.fillText("SCORE: " + score, canvasWidth() / 2, canvasHeight() / 2 + 18);
    if (Math.floor(Date.now() / 420) % 2 === 0) {
      ctx.fillText("PRESS SPACE TO RESTART", canvasWidth() / 2, canvasHeight() / 2 + 66);
    }
    ctx.restore();
  }

  function drawLevelCompleteScreen() {
    ctx.save();
    ctx.fillStyle = "rgba(2, 3, 11, 0.74)";
    ctx.fillRect(0, 0, canvasWidth(), canvasHeight());
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 38px 'Courier New', monospace";
    ctx.fillText("LEVEL CLEAR", canvasWidth() / 2, canvasHeight() / 2 - 20);
    ctx.shadowColor = "#00eeff";
    ctx.fillStyle = "#00eeff";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("SCORE " + score, canvasWidth() / 2, canvasHeight() / 2 + 26);
    if (Math.floor(Date.now() / 420) % 2 === 0) {
      ctx.fillText("PRESS SPACE", canvasWidth() / 2, canvasHeight() / 2 + 62);
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, canvasWidth(), canvasHeight());
    if (!started) {
      drawStartScreen();
      return;
    }
    drawBackground();
    drawMaze();
    drawDots();
    for (const ghost of ghosts) drawGhost(ghost);
    drawPac();
    drawHud();
    if (gameOver) drawGameOverScreen();
    if (levelComplete) drawLevelCompleteScreen();
  }

  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function resizeAll() {
    resize();
    resizeBackground();
  }

  window.addEventListener("load", resizeAll);
  window.addEventListener("resize", resizeAll);
  window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if (!started) {
      if (key === "arrowup" || key === "w") {
        menuIndex = (menuIndex + MENU_OPTIONS.length - 1) % MENU_OPTIONS.length;
        event.preventDefault();
        return;
      }
      if (key === "arrowdown" || key === "s") {
        menuIndex = (menuIndex + 1) % MENU_OPTIONS.length;
        event.preventDefault();
        return;
      }
      if (key === "enter" || key === " ") {
        started = true;
        event.preventDefault();
        return;
      }
    }
    const map = {
      arrowleft: "left",
      a: "left",
      arrowright: "right",
      d: "right",
      arrowup: "up",
      w: "up",
      arrowdown: "down",
      s: "down"
    };
    if (map[key]) {
      wantedDir = map[key];
      event.preventDefault();
    }
    if ((key === "enter" || key === " ") && (gameOver || levelComplete)) {
      newGame();
      started = true;
      event.preventDefault();
    }
  });

  started = false;
  menuIndex = 1;
  resizeAll();
  newGame();
  requestAnimationFrame(backgroundLoop);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
