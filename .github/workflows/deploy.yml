name: Deploy to GitHub Pages

on:
  push:
    branches: [pygbag]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pygbag

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygame and pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygame pygbag

      - name: Install game dependencies
        run: |
          pip install -r requirements.txt

      - name: Build with pygbag
        run: |
          python -m pygbag --build --width 800 --height 600 .

      - name: Patch web build
        run: |
          python post_build.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web showcase
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Copy showcase into build/web/showcase
        run: |
          mkdir -p build/web/showcase
          cp -r web/dist/. build/web/showcase/

      - name: Create GitHub Pages SPA fallback
        run: |
          cat > build/web/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Redirecting...</title>
              <script>
                const showcaseBase = "/Pacman/showcase";
                if (window.location.pathname.startsWith(`${showcaseBase}/`)) {
                  const route = window.location.pathname.slice(showcaseBase.length) || "/";
                  window.location.replace(`${showcaseBase}/#${route}${window.location.search}`);
                } else {
                  window.location.replace("/Pacman/");
                }
              </script>
            </head>
            <body>Redirecting...</body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
